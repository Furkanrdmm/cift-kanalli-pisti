<!doctype html>
<!-- Play kapak görseli (1024x500). Üretmek için DUZEN.md'deki komut kullanılır. -->
<html lang="tr">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Fredoka; src: url(../node_modules/@fontsource-variable/fredoka/files/fredoka-latin-wght-normal.woff2); font-weight: 300 700; }
  @font-face { font-family: Fredoka; src: url(../node_modules/@fontsource-variable/fredoka/files/fredoka-latin-ext-wght-normal.woff2); font-weight: 300 700; unicode-range: U+0100-024F; }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 40%, #2a8048, #134526 75%);
    font-family: Fredoka, sans-serif;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 70px; box-sizing: border-box; position: relative;
  }
  body::after { content: ''; position: absolute; inset: 14px; border: 3px solid rgba(232, 194, 106, 0.55); border-radius: 28px; }
  .title { color: #f6ead0; font-size: 46px; font-weight: 500; line-height: 1; }
  .title b { display: block; font-size: 128px; font-weight: 700; color: #e8c26a; text-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .sub { margin-top: 18px; color: #f6ead0; opacity: .85; font-size: 28px; }
  .cards { position: relative; width: 400px; height: 320px; }
  .card { position: absolute; width: 150px; height: 210px; border-radius: 16px; background: linear-gradient(165deg,#fffefb,#f3eadb);
    box-shadow: 0 12px 28px rgba(0,0,0,.4); font-size: 40px; font-weight: 600; padding: 12px 16px; box-sizing: border-box; }
  .card i { position: absolute; inset: 0; display: grid; place-items: center; font-style: normal; font-size: 90px; }
  .red { color: #c62828; } .blk { color: #1b1b1b; }
</style>
</head>
<body>
  <div>
    <div class="title">Çift Kanallı<b>Pişti</b></div>
    <div class="sub">Bildiğin pişti, ama iki kanallı</div>
  </div>
  <div class="cards">
    <div class="card blk" style="left:10px;top:60px;transform:rotate(-14deg)">7<i>♠</i></div>
    <div class="card red" style="left:125px;top:30px;transform:rotate(-2deg)">7<i>♥</i></div>
    <div class="card red" style="left:240px;top:60px;transform:rotate(12deg)">J<i>♦</i></div>
  </div>
</body>
</html>
